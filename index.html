<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStoreIndia - Best Online Deals & Products</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-center text-indigo-600">SuperStoreIndia Products</h1>
        <div id="productContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <p class="col-span-full text-center text-gray-500">Loading products...</p>
        </div>
    </div>

    <!-- Google SEO Schema Script container -->
    <div id="seoSchemaContainer"></div>

    <script>
        const CLOUD_NAME = "dgugrfacv";

        async function checkStore() {
            const container = document.getElementById('productContainer');
            const schemaContainer = document.getElementById('seoSchemaContainer');
            try {
                const response = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/smart_product.json?t=${Date.now()}`);
                const data = await response.json();

                if (!data.resources || data.resources.length === 0) {
                    container.innerHTML = "<p class='col-span-full text-center py-10 text-red-500'>No products found!</p>";
                    return;
                }

                container.innerHTML = "";
                let schemaItems = [];

                data.resources.forEach(item => {
                    const ctx = item.context?.custom || {};
                    const name = ctx.n || "SuperStoreIndia Product";
                    const price = ctx.p || "0";
                    const imageUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${item.public_id}.${item.format}`;

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-md flex flex-col items-center">
                            <img src="${imageUrl}" alt="${name} - Buy Online at Best Price on SuperStoreIndia" title="${name}" class="w-full h-40 object-cover rounded-lg mb-2 bg-gray-200" loading="lazy">
                            <h2 class="font-bold text-gray-800 text-sm mb-1 text-center">${name}</h2>
                            <span class="text-indigo-600 font-bold">₹${price}</span>
                        </div>
                    `;

                    schemaItems.push({
                        "@type": "Product",
                        "name": name,
                        "image": imageUrl,
                        "offers": {
                            "@type": "Offer",
                            "priceCurrency": "INR",
                            "price": price,
                            "availability": "https://schema.org/InStock"
                        }
                    });
                });

                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.text = JSON.stringify({
                    "@context": "https://schema.org/",
                    "@type": "ItemList",
                    "itemListElement": schemaItems.map((prod, index) => ({
                        "@type": "ListItem",
                        "position": index + 1,
                        "item": prod
                    }))
                });
                schemaContainer.innerHTML = "";
                schemaContainer.appendChild(scriptTag);

            } catch (error) {
                container.innerHTML = `<div class="col-span-full text-center p-10 text-red-500">Error loading data: ${error.message}</div>`;
            }
        }

        checkStore();
    </script>
</body>
</html>
